<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>余白 · GitHub Pages 视频测试</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f3efe7; color: #173c37; font: 1rem/1.65 system-ui, sans-serif }
    main { width: min(100% - 2rem, 48rem); margin: clamp(2rem, 8vw, 5rem) auto }
    h1 { font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.14; margin: 0 0 1rem }
    video { display: block; width: 100%; aspect-ratio: 16/9; background: #173c37; border-radius: .75rem }
    a { color: inherit; text-underline-offset: .2em }
  </style>
</head>
<body>
  <main>
    <h1>余白 · 视频播放测试</h1>
    <p>播放这段 12 秒的计时片，再把进度条拖到第 8 秒，观察时间码是否立即跳转。</p>
    <video controls playsinline preload="metadata" aria-label="12 秒视频播放与拖动进度测试">
      <source src="./assets/video-test.mp4" type="video/mp4">
    </video>
    <p><a href="./assets/video-test.mp4">直接打开 MP4</a> · H.264 · 640 × 360 · 无声</p>
  </main>
</body>
</html>
